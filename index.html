<script>
var d=new Date();var hoyStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
firebase.initializeApp({databaseURL:"https://inventario-19b33-default-rtdb.europe-west1.firebasedatabase.app"});var db=firebase.database();var inv={},car=[],compraTemp=[],ventas={},gastos={},abonos={},compras={},prestamos={},abonosPrestamos={},filtroFecha="TODO",filtroGastos="DIA";var compraFotoTemp=null,scannerActivo=false,scannerTarget="ventas",streamActual=null;
var searchResults=[],searchResultsCompras=[];
var modoOffline=!navigator.onLine;
var colaOffline=JSON.parse(localStorage.getItem("colaVentasOffline")||"[]");
function guardarInvOffline(){try{localStorage.setItem("invOffline", JSON.stringify(inv));}catch(e){}}
function checkOffline(){modoOffline=!navigator.onLine;var bar=document.getElementById("offlineBar");if(bar) bar.classList.toggle("show", modoOffline); if(navigator.onLine && colaOffline.length>0){ sincronizarOffline(); }}
window.addEventListener('online', ()=>{ checkOffline(); toast("✅ Internet volvió"); sincronizarOffline(); });
window.addEventListener('offline', ()=>{ checkOffline(); toast("📴 OFFLINE"); });
function sincronizarOffline(){if(colaOffline.length==0 || !navigator.onLine) return; var copia=[...colaOffline]; copia.forEach(v=>{ db.ref("ventas").push(v); }); colaOffline=[]; localStorage.setItem("colaVentasOffline","[]"); checkOffline(); toast("✅ "+copia.length+" ventas subidas");}
function guardarVentaOffline(v){colaOffline.push(v); localStorage.setItem("colaVentasOffline", JSON.stringify(colaOffline)); renderTodo();}
function toast(m){var e=document.getElementById("msg");e.innerHTML=m.replace(/\n/g,"<br>");e.style.display="block";setTimeout(function(){e.style.display="none"},4000);}
function ver(t){document.querySelectorAll('[id^="sec-"]').forEach(function(s){s.classList.add("hidden");});var sec=document.getElementById("sec-"+t);if(sec) sec.classList.remove("hidden");document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("active");});var tab=document.getElementById("tab-"+t);if(tab) tab.classList.add("active");if(t=="fiados") renderFiados(); if(t=="facturas") renderFacturas(); if(t=="resumen") renderTodo(); if(t=="prest") renderPrestamos();}
function ponerHoy(){document.getElementById("fechaInicio").value=hoyStr;filtroFecha=hoyStr;renderTodo();}function ponerAyer(){var dd=new Date();dd.setDate(dd.getDate()-1);filtroFecha=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,'0')+"-"+String(dd.getDate()).padStart(2,'0');document.getElementById("fechaInicio").value=filtroFecha;renderTodo();}function verTodo(){filtroFecha="TODO";document.getElementById("fechaInicio").value="";renderTodo();}
function verTodoGastos(){filtroGastos="TODO";document.getElementById("fechaGasto").value="";renderGastos();}
function verTodoFacturas(){document.getElementById("fechaFacturas").value="";renderFacturas();}
function guardarApertura(){var v=document.getElementById("apertura")?document.getElementById("apertura").value:"0";if(v==""||v==null) v="0";try{localStorage.setItem("apertura_"+hoyStr,v);}catch(e){}renderTodo();}
function scanInvent(){abrirScanner("invent");}function scanVentas(){abrirScanner("ventas");}function scanCompras(){abrirScanner("compras");}
function abrirScanner(target){scannerTarget=target;var overlay=document.getElementById("scannerOverlay");overlay.style.display="flex";var video=document.getElementById("video");if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(stream){streamActual=stream;video.srcObject=stream;video.play();scannerActivo=true;escanearLoop();}).catch(function(){toast("No camara");cerrarScanner();});}}
function cerrarScanner(){scannerActivo=false;document.getElementById("scannerOverlay").style.display="none";if(streamActual){streamActual.getTracks().forEach(function(t){t.stop();});streamActual=null;}}
function escanearLoop(){if(!scannerActivo) return;var video=document.getElementById("video");var canvas=document.getElementById("canvas");if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;var ctx=canvas.getContext("2d");ctx.drawImage(video,0,0,canvas.width,canvas.height);if("BarcodeDetector" in window){var detector=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","qr_code"]});detector.detect(canvas).then(function(barcodes){if(barcodes.length>0){var code=barcodes[0].rawValue;toast("CODIGO "+code);cerrarScanner();if(scannerTarget=="compras") document.getElementById("codigoProd").value=code;else if(scannerTarget=="invent"){document.getElementById("buscarInvent").value=code;buscarInvent();}else{document.getElementById("buscar").value=code;buscar();}return;}requestAnimationFrame(escanearLoop);}).catch(function(){requestAnimationFrame(escanearLoop);});}else{requestAnimationFrame(escanearLoop);}}else{requestAnimationFrame(escanearLoop);}}
function buscar(){var q=document.getElementById("buscar").value.toLowerCase().trim();var d=document.getElementById("dropdown");if(!q){d.style.display="none";return;}var h="";searchResults=[];var count=0;for(var k in inv){var p=inv[k];if(!p||!p.nombre) continue;if(p.nombre.toLowerCase().indexOf(q)>=0||(p.codigo||"").toString().toLowerCase().indexOf(q)>=0){searchResults.push(k);h+='<div class="fact" onclick="addCartIdx('+(searchResults.length-1)+')" style="cursor:pointer"><b>'+p.nombre.toUpperCase()+'</b> $'+parseFloat(p.venta||0).toFixed(2)+' STOCK '+(p.stock||0)+'</div>';count++;if(count>20) break;}}d.innerHTML=h||"<div style='padding:14px'>NO ENCONTRADO</div>";d.style.display="block";}
function addCartIdx(i){var k=searchResults[i];if(!k) return;addCart(k);}
function addCart(k){if(!inv[k]) return;var cant=parseInt(document.getElementById("cant").value||1);if(cant<=0) cant=1;var p=inv[k];var found=-1;for(var ii=0;ii<car.length;ii++) if(car[ii].key==k) found=ii;if(found>=0){car[found].cant+=cant;}else{car.push({key:k,nombre:p.nombre,venta:parseFloat(p.venta||0),compra:parseFloat(p.compra||0),cant:cant});}renderCar();toast(p.nombre.toUpperCase()+" x"+cant);document.getElementById("dropdown").style.display="none";document.getElementById("buscar").value="";}
function cobrarDirecto(){if(car.length==0){toast("VACIO");return;}vender("EFECTIVO");}
function actualizarPagoDividido(){
 var tot=0;for(var i=0;i<car.length;i++) tot+=car[i].venta*car[i].cant;
 var abono=parseFloat(document.getElementById("abonoClienteVenta")?.value||0);
 var aporte=parseFloat(document.getElementById("aporteTiendaVenta")?.value||0);
 var saldo=tot - abono - aporte;
 var el=document.getElementById("saldoVenta");
 if(!el) return;
 if(Math.abs(saldo)<0.01) el.innerHTML="✅ $0.00 CUADRADO - Inventario SI se descuenta";
 else if(saldo>0) el.innerHTML="⚠️ FALTA $"+saldo.toFixed(2)+" POR COBRAR";
 else el.innerHTML="⚠️ SOBRA $"+Math.abs(saldo).toFixed(2);
