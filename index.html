<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>VIVERES ORQUIDEA ORIGINAL 9 VENTANAS 20 CUADROS</title><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#FFF7ED;padding-bottom:80px}.header{background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:14px;display:flex;position:sticky;top:0;z-index:50;font-weight:900;font-size:18px}.tabs{display:flex;gap:6px;padding:8px;overflow:auto;background:white;position:sticky;top:52px;z-index:40;border-bottom:4px solid #FF6B35;white-space:nowrap}.tab{padding:14px 16px;border-radius:12px;border:2px solid #FFE4CC;background:white;font-weight:900;font-size:13px;cursor:pointer;min-width:95px;text-align:center}.tab.active{background:#FF6B35;color:white;transform:scale(1.05)}.card{background:white;margin:8px;border-radius:14px;padding:12px;border:2px solid #FFE4CC;box-shadow:0 2px 8px rgba(0,0,0,0.06)}.input{width:100%;height:52px;border:2px solid #FFE4CC;border-radius:12px;padding:0 12px;background:#FFFBF7;font-weight:900;margin:6px 0;font-size:15px}.hidden{display:none!important}.fact{border:2px solid #FFE4CC;border-radius:14px;padding:14px;margin:8px 0;background:white;font-size:14px}.btn{height:52px;border-radius:12px;border:2px solid #FFE4CC;font-weight:900;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.big-naranja{background:linear-gradient(90deg,#FF6B35,#F59E0B)!important;color:white!important;border:3px solid white!important}</style></head><body>
<div class="header"><b>VIVERES ORQUIDEA</b><span id="estado" style="margin-left:auto;background:white;color:#FF6B35;padding:8px 14px;border-radius:99px;font-size:11px">CARGANDO</span></div>
<div class="tabs"><button class="tab active" id="tab-inicio" onclick="ver('inicio')">INICIO</button><button class="tab" id="tab-invent" onclick="ver('invent')">INVENTARIO</button><button class="tab" id="tab-ventas" onclick="ver('ventas')">VENTAS</button><button class="tab" id="tab-compras" onclick="ver('compras')">COMPRAS</button><button class="tab" id="tab-facturas" onclick="ver('facturas')">FACTURAS</button><button class="tab" id="tab-fiados" onclick="ver('fiados')">FIADOS</button><button class="tab" id="tab-prest" onclick="ver('prest')">PRESTAMOS</button><button class="tab" id="tab-gastos" onclick="ver('gastos')">GASTOS</button><button class="tab" id="tab-resumen" onclick="ver('resumen')">TOTAL</button></div>

<div id="sec-inicio" class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="apertura" type="number" class="input" placeholder="APERTURA $ 0" oninput="guardarApertura()"><div id="cierre" style="height:52px;background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900">$0.00 CIERRE EF</div></div><div id="formulaInicio" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:10px;border-radius:10px;text-align:center;font-weight:900;font-size:12px;margin:6px 0"></div><div id="totalDiaBox" style="background:white;border:3px solid #FF6B35;border-radius:14px;padding:12px;margin:8px 0">CARGANDO...</div><div class="row"><input id="fechaInicio" type="date" class="input" onchange="renderTodo()"><button onclick="ponerHoy()" class="btn" style="background:#16A34A;color:white">HOY</button><button onclick="ponerAyer()" class="btn">AYER</button><button onclick="verTodo()" class="btn" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white">TODO</button></div><div id="listaInicio" style="max-height:800px;overflow:auto;border:3px solid #FF6B35;border-radius:10px;padding:6px;background:#FFF7ED"></div></div>

<div id="sec-invent" class="card hidden"><div style="display:grid;grid-template-columns:1fr 90px;gap:6px"><input id="buscarInvent" class="input" placeholder="BUSCAR..." oninput="buscarInvent()"><button onclick="scanInvent()" class="btn" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white">📷 SCAN</button></div><div id="listaInvent"></div></div>

<div id="sec-ventas" class="card hidden"><button id="totalCobrar" onclick="cobrarDirecto()" class="big-naranja" style="width:100%;padding:24px;border-radius:16px;text-align:center;font-weight:900;font-size:38px;margin:12px 0;border:none">$0.00 COBRAR</button><div style="display:grid;grid-template-columns:70px 1fr 90px;gap:6px"><input id="cant" type="number" value="1" class="input" style="text-align:center"><input id="buscar" class="input" placeholder="BUSCAR..." oninput="buscar()"><button onclick="scanVentas()" class="btn" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white">📷 SCAN</button></div><div id="dropdown" style="background:white;border:3px solid #16A34A;border-radius:12px;max-height:350px;overflow:auto;display:none"></div><div id="carrito" style="border:3px dashed #16A34A;border-radius:14px;padding:12px;min-height:70px;background:#F0FDF4;margin:8px 0">VACIO</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px"><input id="fechaVentaInput" type="date" class="input"><button onclick="vender('TRANSFERENCIA')" class="btn">💳 TRANS</button><button onclick="vender('FIADO')" class="btn">📒 FIADO</button><button onclick="vender('CONSUMO')" class="btn">🍽️ CONS</button></div><input id="cliente" class="input" placeholder="CLIENTE:"><div id="listaVentasHoy" style="max-height:600px;overflow:auto;border:3px solid #FF6B35;border-radius:10px;padding:6px"></div></div>

<div id="sec-compras" class="card hidden"><div id="totalComprasHeader" class="big-naranja" style="padding:16px;border-radius:14px;text-align:center;font-weight:900;margin:8px 0">T: $0.00 | GAN: $0.00</div><div id="listaCompras" style="max-height:380px;overflow:auto;border:2px solid #FF6B35;border-radius:10px;padding:6px;background:#FFF7ED"></div><div id="listaCompra" style="border:3px dashed #FF6B35;border-radius:12px;padding:12px;min-height:70px;background:#FFFBF7;margin:10px 0">VACIA</div><div class="row"><input id="nombreProd" class="input" placeholder="PRODUCTO" oninput="buscarEnCompras()"><input id="cantProd" type="number" value="1" class="input"></div><div class="row"><input id="compraProd" type="number" step="0.01" class="input" placeholder="COMPRA $"><input id="ventaProd" type="number" step="0.01" class="input" placeholder="VENTA $"></div><div class="row"><input id="codigoProd" class="input" placeholder="CODIGO"><input id="prov" class="input" placeholder="PROVEEDOR"></div><div class="row"><select id="pagoCompra" class="input"><option>EFECTIVO</option><option>TRANSFERENCIA</option><option>CREDITO FIADO</option></select><button onclick="scanCompras()" class="btn" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white">📷 SCAN</button></div><div id="dropdownCompras" style="background:white;border:3px solid #FF6B35;border-radius:12px;max-height:350px;overflow:auto;display:none"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0"><button onclick="agregarACompra()" class="btn" style="height:64px;background:#10B981;color:white;border:none">➕ AGREGAR</button><button onclick="guardarCompra()" class="btn big-naranja" style="height:64px">💾 GUARDAR</button></div><input id="fechaCompra" type="date" class="input"></div>

<div id="sec-fiados" class="card hidden"><div id="totalFiado" style="background:#DC2626;color:white;padding:14px;border-radius:12px;text-align:center;font-weight:900;margin:8px 0">$0.00 POR COBRAR</div><div id="listaFiados"></div></div>
<div id="sec-prest" class="card hidden"><div id="totalPrestado" style="background:#7C3AED;color:white;padding:14px;border-radius:12px;text-align:center;font-weight:900;margin:8px 0">$0.00 PRESTADO</div><div id="listaPrestamos"></div></div>
<div id="sec-gastos" class="card hidden"><div class="row"><input id="conceptoGasto" class="input" placeholder="CONCEPTO"><input id="montoGasto" type="number" step="0.01" class="input" placeholder="$ MONTO"></div><div class="row"><select id="pagoGasto" class="input"><option>EFECTIVO</option><option>TRANSFERENCIA</option></select><button onclick="agregarGasto()" class="btn" style="background:#DC2626;color:white">➕ GASTO</button></div><div id="totalGastosHeader" style="background:#DC2626;color:white;padding:12px;border-radius:10px;text-align:center;font-weight:900;margin:8px 0"></div><div id="listaGastos" style="max-height:500px;overflow:auto;border:2px solid #DC2626;border-radius:10px;padding:6px;background:#FFF1F2"></div></div>
<div id="sec-facturas" class="card hidden"><div id="listaFacturas"></div></div>
<div id="sec-resumen" class="card hidden"><div id="totalInventarioBox" style="background:linear-gradient(90deg,#2563EB,#3B82F6);color:white;padding:16px;border-radius:12px;text-align:center;font-weight:900;margin:8px 0">CARGANDO...</div><div id="formulaTotal" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:12px;border-radius:10px;text-align:center;font-weight:900;font-size:12px;margin:8px 0"></div><div id="cuadrosTotal" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0"></div></div>
<div id="msg" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#FF6B35;color:white;padding:14px 24px;border-radius:99px;display:none;z-index:9999;font-weight:900"></div>
<div id="scannerOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:9999;flex-direction:column;align-items:center;justify-content:center"><video id="video" style="width:92%;max-width:420px;border:4px solid #FF6B35;border-radius:14px"></video><div style="color:white;font-weight:900;margin:14px">ESCANEANDO...</div><button onclick="cerrarScanner()" style="background:#DC2626;color:white;border:none;padding:14px 28px;border-radius:10px;font-weight:900">CERRAR</button><canvas id="canvas" style="display:none"></canvas></div>
<script>
var d=new Date();var hoyStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
firebase.initializeApp({databaseURL:"https://inventario-19b33-default-rtdb.europe-west1.firebasedatabase.app"});var db=firebase.database();var inv={},car=[],compraTemp=[],ventas={},gastos={},abonos={},compras={},prestamos={},abonosPrestamos={},filtroFecha="TODO",filtroGastos="TODO";var compraFotoTemp=null,scannerActivo=false,scannerTarget="ventas",streamActual=null;var searchResults=[],searchResultsCompras=[];
function toast(m){var e=document.getElementById("msg");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",3000);}
function ver(t){document.querySelectorAll('[id^="sec-"]').forEach(s=>s.classList.add("hidden"));document.getElementById("sec-"+t).classList.remove("hidden");document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.getElementById("tab-"+t).classList.add("active");if(t=="fiados")renderFiados();if(t=="facturas")renderFacturas();if(t=="resumen")renderTodo();if(t=="prest")renderPrestamos();}
function ponerHoy(){document.getElementById("fechaInicio").value=hoyStr;filtroFecha=hoyStr;renderTodo();}function ponerAyer(){var dd=new Date();dd.setDate(dd.getDate()-1);filtroFecha=dd.toISOString().substring(0,10);document.getElementById("fechaInicio").value=filtroFecha;renderTodo();}function verTodo(){filtroFecha="TODO";document.getElementById("fechaInicio").value="";renderTodo();}
function guardarApertura(){var v=document.getElementById("apertura").value||"0";localStorage.setItem("apertura_"+hoyStr,v);renderTodo();}
function scanInvent(){abrirScanner("invent");}function scanVentas(){abrirScanner("ventas");}function scanCompras(){abrirScanner("compras");}
function abrirScanner(target){scannerTarget=target;document.getElementById("scannerOverlay").style.display="flex";var video=document.getElementById("video");navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(stream=>{streamActual=stream;video.srcObject=stream;video.play();scannerActivo=true;escanearLoop();});}
function cerrarScanner(){scannerActivo=false;document.getElementById("scannerOverlay").style.display="none";if(streamActual){streamActual.getTracks().forEach(t=>t.stop());streamActual=null;}}
function escanearLoop(){if(!scannerActivo)return;var video=document.getElementById("video");var canvas=document.getElementById("canvas");if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;var ctx=canvas.getContext("2d");ctx.drawImage(video,0,0,canvas.width,canvas.height);if("BarcodeDetector" in window){var detector=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","qr_code"]});detector.detect(canvas).then(barcodes=>{if(barcodes.length>0){var code=barcodes[0].rawValue;toast("CODIGO "+code);cerrarScanner();if(scannerTarget=="compras")document.getElementById("codigoProd").value=code;else if(scannerTarget=="invent"){document.getElementById("buscarInvent").value=code;buscarInvent();}else{document.getElementById("buscar").value=code;buscar();}return;}requestAnimationFrame(escanearLoop);});}else requestAnimationFrame(escanearLoop);}else requestAnimationFrame(escanearLoop);}
function buscar(){var q=document.getElementById("buscar").value.toLowerCase().trim();var d=document.getElementById("dropdown");if(!q){d.style.display="none";return;}var h="";searchResults=[];var count=0;for(var k in inv){var p=inv[k];if(!p||!p.nombre)continue;if(p.nombre.toLowerCase().indexOf(q)>=0||(p.codigo||"").toLowerCase().indexOf(q)>=0){searchResults.push(k);h+='<div class="fact" onclick="addCartIdx('+(searchResults.length-1)+')" style="cursor:pointer"><b>'+p.nombre.toUpperCase()+'</b> $'+parseFloat(p.venta||0).toFixed(2)+' STOCK '+(p.stock||0)+'</div>';count++;if(count>20)break;}}d.innerHTML=h||"<div style='padding:14px'>NO ENCONTRADO</div>";d.style.display="block";}
function addCartIdx(i){addCart(searchResults[i]);}
function addCart(k){if(!inv[k])return;var cant=parseInt(document.getElementById("cant").value||1);var p=inv[k];var f=-1;for(var i=0;i<car.length;i++)if(car[i].key==k)f=i;if(f>=0)car[f].cant+=cant;else car.push({key:k,nombre:p.nombre,venta:parseFloat(p.venta||0),compra:parseFloat(p.compra||0),cant:cant});renderCar();document.getElementById("dropdown").style.display="none";document.getElementById("buscar").value="";}
function cobrarDirecto(){if(car.length==0)return;vender("EFECTIVO");}
function renderCar(){var h="";var sub=0;for(var i=0;i<car.length;i++)sub+=car[i].venta*car[i].cant;for(var i=0;i<car.length;i++){var p=car[i];h+='<div class="fact" style="display:flex;justify-content:space-between;background:#F0FDF4"><div><b>'+p.nombre.toUpperCase()+' x'+p.cant+'</b> $'+(p.venta*p.cant).toFixed(2)+'</div><button onclick="car.splice('+i+',1);renderCar()" style="background:#DC2626;color:white;border:none;border-radius:8px;padding:10px">X</button></div>';}document.getElementById("carrito").innerHTML=h||"VACIO";document.getElementById("totalCobrar").innerHTML="$"+sub.toFixed(2)+" COBRAR";}
function vender(pago){if(car.length==0)return;var tot=0,gan=0;for(var i=0;i<car.length;i++){tot+=car[i].venta*car[i].cant;gan+=(car[i].venta-car[i].compra)*car[i].cant;}var cli=document.getElementById("cliente").value.trim().toUpperCase()||"CLIENTE";var fecha=document.getElementById("fechaVentaInput").value||hoyStr;var ventaData={prods:car,total:tot,ganancia:gan,cliente:cli,fecha:Date.now(),fechaStr:fecha+" "+new Date().toTimeString().substring(0,5),pago:pago};for(var i=0;i<car.length;i++){if(inv[car[i].key]){var ns=Math.max(0,parseInt(inv[car[i].key].stock||0)-car[i].cant);db.ref("inventario/"+car[i].key+"/stock").set(ns);}}db.ref("ventas").push(ventaData).then(()=>{toast("✅ $"+tot.toFixed(2));car=[];renderCar();renderTodo();});}
function buscarEnCompras(){var q=document.getElementById("nombreProd").value.toLowerCase().trim();var drop=document.getElementById("dropdownCompras");if(!q){drop.style.display="none";return;}var h="";searchResultsCompras=[];for(var k in inv){var p=inv[k];if(!p||!p.nombre)continue;if(p.nombre.toLowerCase().indexOf(q)>=0){searchResultsCompras.push(k);h+='<div onclick="usarProductoIdx('+(searchResultsCompras.length-1)+')" style="padding:14px;border-bottom:1px solid #FFE4CC;cursor:pointer"><b>'+p.nombre.toUpperCase()+'</b></div>';}}drop.innerHTML=h||"NO ENCONTRADO";drop.style.display="block";}
function usarProductoIdx(i){usarProducto(searchResultsCompras[i]);}
function usarProducto(k){var p=inv[k];document.getElementById("nombreProd").value=p.nombre;document.getElementById("compraProd").value=p.compra||"";document.getElementById("ventaProd").value=p.venta||"";document.getElementById("codigoProd").value=p.codigo||"";document.getElementById("dropdownCompras").style.display="none";}
function buscarInvent(){var q=document.getElementById("buscarInvent").value.toLowerCase().trim();var h="";var list=[];for(var k in inv){var p=inv[k];if(!p||!p.nombre)continue;if(q&&p.nombre.toLowerCase().indexOf(q)<0&&(p.codigo||"").toLowerCase().indexOf(q)<0)continue;list.push({k:k,p:p});}list.sort((a,b)=>a.p.nombre.localeCompare(b.p.nombre));for(var i=0;i<Math.min(list.length,120);i++){var k=list[i].k;var p=list[i].p;var s=parseInt(p.stock||0);h+='<div class="fact"><b>'+p.nombre.toUpperCase()+'</b> STOCK <b style="color:'+(s<=3?'#DC2626':'#16A34A')+'">'+s+'</b> $'+parseFloat(p.venta||0).toFixed(2)+' <button onclick="addCartDirecto(\''+k+'\')" style="background:#F59E0B;color:white;border:none;border-radius:8px;padding:6px 10px">➕ VENTA</button></div>';}document.getElementById("listaInvent").innerHTML=h||"VACIO - Si ves esto, espera 2 segundos que cargue Firebase";}
function addCartDirecto(k){if(!inv[k])return;var cant=parseInt(prompt("Cuantos?","1")||"1");var f=-1;for(var i=0;i<car.length;i++)if(car[i].key==k)f=i;if(f>=0)car[f].cant+=cant;else car.push({key:k,nombre:inv[k].nombre,venta:parseFloat(inv[k].venta||0),compra:parseFloat(inv[k].compra||0),cant:cant});renderCar();ver("ventas");}
function agregarACompra(){var n=document.getElementById("nombreProd").value.trim();var cant=parseInt(document.getElementById("cantProd").value)||0;var comp=parseFloat(document.getElementById("compraProd").value)||0;var vent=parseFloat(document.getElementById("ventaProd").value)||0;var cod=document.getElementById("codigoProd").value.trim().toUpperCase();var prov=document.getElementById("prov").value.trim()||"PROV";if(!n||cant<=0)return;var codKey=cod?cod.replace(/[^A-Z0-9]/g,"_"):n.toUpperCase().replace(/[^A-Z0-9]/g,"").substring(0,14)+"_"+Date.now().toString().slice(-4);compraTemp.push({nombre:n,cantidad:cant,compra:comp,venta:vent,codigo:cod,codigoKey:codKey,proveedor:prov.toUpperCase(),total:comp*cant});document.getElementById("nombreProd").value="";document.getElementById("cantProd").value="1";document.getElementById("compraProd").value="";document.getElementById("ventaProd").value="";document.getElementById("codigoProd").value="";renderCompraTemp();}
function renderCompraTemp(){var h="";var tot=0,gan=0;for(var i=0;i<compraTemp.length;i++){var p=compraTemp[i];tot+=p.total;gan+=(p.venta-p.compra)*p.cantidad;h+='<div class="fact"><b>'+p.nombre.toUpperCase()+' x'+p.cantidad+'</b> $'+p.total.toFixed(2)+'<button onclick="compraTemp.splice('+i+',1);renderCompraTemp()" style="background:#DC2626;color:white;border:none;border-radius:8px;padding:6px">X</button></div>';}document.getElementById("listaCompra").innerHTML=h||"VACIA";document.getElementById("totalComprasHeader").innerHTML="T: $"+tot.toFixed(2)+" | GAN: $"+gan.toFixed(2);}
function guardarCompra(){if(compraTemp.length==0)return;var prov=document.getElementById("prov").value.trim()||"PROV";var pago=document.getElementById("pagoCompra").value||"EFECTIVO";var fecha=document.getElementById("fechaCompra").value||hoyStr;var tot=0,gan=0;for(var i=0;i<compraTemp.length;i++){tot+=compraTemp[i].total;gan+=(compraTemp[i].venta-compraTemp[i].compra)*compraTemp[i].cantidad;}for(var i=0;i<compraTemp.length;i++){var p=compraTemp[i];var ex=inv[p.codigoKey]||{};var st=(parseInt(ex.stock)||0)+parseInt(p.cantidad||0);db.ref("inventario/"+p.codigoKey).set({nombre:p.nombre,stock:st,compra:p.compra,venta:p.venta,codigo:p.codigo,proveedor:p.proveedor});}db.ref("compras").push({proveedor:prov.toUpperCase(),productos:compraTemp,total:tot,ganancia:gan,pago:pago.toUpperCase(),fecha:fecha,fechaStr:fecha+" "+new Date().toTimeString().substring(0,5),timestamp:Date.now()}).then(()=>{toast("COMPRA $"+tot.toFixed(2));compraTemp=[];renderCompraTemp();});}
function agregarGasto(){var c=document.getElementById("conceptoGasto").value.trim();var m=parseFloat(document.getElementById("montoGasto").value)||0;var p=document.getElementById("pagoGasto").value||"EFECTIVO";var f=hoyStr;if(!c||m<=0)return;db.ref("gastos").push({concepto:c.toUpperCase(),monto:m,pago:p.toUpperCase(),fecha:f,fechaStr:f+" "+new Date().toTimeString().substring(0,5),timestamp:Date.now()});}
function renderGastos(){var h="",tot=0;var arr=[];for(var k in gastos){arr.push({id:k,g:gastos[k]});}arr.sort((a,b)=>(b.g.timestamp||0)-(a.g.timestamp||0));for(var i=0;i<arr.length;i++){var g=arr[i].g;tot+=parseFloat(g.monto||0);h+='<div class="fact"><b>'+(g.concepto||"").toUpperCase()+' $'+parseFloat(g.monto||0).toFixed(2)+' '+g.pago+'</b><button onclick="db.ref(\'gastos/'+arr[i].id+'\').remove()" style="background:#DC2626;color:white;border:none;border-radius:8px;padding:6px">X</button></div>';}document.getElementById("totalGastosHeader").textContent="Total: $"+tot.toFixed(2);document.getElementById("listaGastos").innerHTML=h||"SIN GASTOS";}
function renderCompras(){var h="",tot=0,ganTot=0,arr=[];for(var k in compras){arr.push({id:k,c:compras[k]});}arr.sort((a,b)=>(b.c.timestamp||0)-(a.c.timestamp||0));for(var i=0;i<arr.length;i++){var c=arr[i].c;tot+=parseFloat(c.total||0);ganTot+=parseFloat(c.ganancia||0);h+='<div class="fact"><b>$'+parseFloat(c.total||0).toFixed(2)+' '+(c.proveedor||"")+'</b></div>';}document.getElementById("totalComprasHeader").innerHTML="Total: $"+tot.toFixed(2)+" | GAN: $"+ganTot.toFixed(2);document.getElementById("listaCompras").innerHTML=h||"SIN COMPRAS";}
function renderFiados(){var h="",tot=0;for(var id in ventas){var v=ventas[id];if((v.pago||"").toUpperCase().indexOf("FIAD")<0)continue;var ab=abonos[id]||{};var abonado=0;for(var ak in ab)abonado+=parseFloat(ab[ak].monto||0);var saldo=parseFloat(v.total||0)-abonado;if(saldo<=0.01)continue;tot+=saldo;h+='<div class="fact"><b>'+v.cliente.toUpperCase()+' DEBE $'+saldo.toFixed(2)+'</b></div>';}document.getElementById("listaFiados").innerHTML=h||"SIN FIADOS";document.getElementById("totalFiado").textContent="$"+tot.toFixed(2)+" POR COBRAR";}
function renderPrestamos(){var h="",tot=0;for(var k in prestamos){var pr=prestamos[k];var abon=0;for(var ak in (pr.abonos||{}))abon+=parseFloat(pr.abonos[ak].monto||0);var saldo=parseFloat(pr.monto||0)-abon;if(saldo<=0.01)continue;tot+=saldo;h+='<div class="fact"><b>'+pr.cliente.toUpperCase()+' $'+saldo.toFixed(2)+'</b></div>';}document.getElementById("listaPrestamos").innerHTML=h||"SIN PRESTAMOS";document.getElementById("totalPrestado").textContent="$"+tot.toFixed(2)+" PRESTADO";}
function renderFacturas(){var h="",vt=0,gt=0,ct=0;for(var k in ventas){vt+=parseFloat(ventas[k].total||0);h+='<div class="fact">VENTA $'+parseFloat(ventas[k].total||0).toFixed(2)+' '+ventas[k].cliente+'</div>';}for(var k in gastos){gt+=parseFloat(gastos[k].monto||0);}for(var k in compras){ct+=parseFloat(compras[k].total||0);}document.getElementById("listaFacturas").innerHTML='<div style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:12px;border-radius:10px;text-align:center;font-weight:900">V $'+vt.toFixed(2)+' - G $'+gt.toFixed(2)+' - C $'+ct.toFixed(2)+' = BAL $'+(vt-gt-ct).toFixed(2)+'</div>'+h;}
function renderTodo(){
var fechaInput=document.getElementById("fechaInicio").value||"";var fechaFiltro=fechaInput?fechaInput:"TODO";var esTodo=fechaFiltro=="TODO";var apertura=parseFloat(localStorage.getItem("apertura_"+hoyStr)||0);var vEf=0,vTr=0,vFi=0,vCons=0,abEf=0,abTr=0,gEf=0,gTr=0,cEf=0,cTr=0,fiadoTotal=0;var invCosto=0,invVenta=0,invUnid=0,invProd=0;for(var k in inv){var p=inv[k];invCosto+=(p.stock||0)*(p.compra||0);invVenta+=(p.stock||0)*(p.venta||0);invUnid+=(p.stock||0);invProd++;}for(var k in ventas){var v=ventas[k];var fg=(v.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;var tot=parseFloat(v.total||0);if(v.pago=="FIADO"){vFi+=tot;var ab=abonos[k]||{};var abon=0;for(var a in ab)abon+=parseFloat(ab[a].monto||0);fiadoTotal+=(tot-abon);}else if(v.pago=="EFECTIVO")vEf+=tot;else if(v.pago=="TRANSFERENCIA")vTr+=tot;else vCons+=tot;}for(var k in abonos){for(var a in abonos[k]){var ab=abonos[k][a];var fg=(ab.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;if((ab.pago||"").toUpperCase()=="TRANSFERENCIA")abTr+=parseFloat(ab.monto||0);else abEf+=parseFloat(ab.monto||0);}}for(var k in gastos){var g=gastos[k];var fg=(g.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;if((g.pago||"").toUpperCase()=="TRANSFERENCIA")gTr+=parseFloat(g.monto||0);else gEf+=parseFloat(g.monto||0);}for(var k in compras){var c=compras[k];var fg=(c.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;if((c.pago||"").toUpperCase()=="TRANSFERENCIA")cTr+=parseFloat(c.total||0);else cEf+=parseFloat(c.total||0);}for(var k in prestamos){var pr=prestamos[k];var abon=0;for(var a in (pr.abonos||{}))abon+=parseFloat(pr.abonos[a].monto||0);fiadoTotal+=(parseFloat(pr.monto||0)-abon);}var ventaReal=vEf+vTr+vCons+abEf+abTr;var totalG=gEf+gTr;var totalC=cEf+cTr;var balance=ventaReal-totalG-totalC;var cajaEf=apertura+vEf+abEf-cEf-gEf;var cajaTr=vTr+abTr-gTr-cTr;var formula="HOY "+hoyStr+" | CIERRE EF Ap $"+apertura.toFixed(2)+" + EF $"+vEf.toFixed(2)+" + AB EF $"+abEf.toFixed(2)+" - C EF $"+cEf.toFixed(2)+" - G EF $"+gEf.toFixed(2)+" = $"+cajaEf.toFixed(2)+" | TR $"+cajaTr.toFixed(2)+" | BAL $"+balance.toFixed(2);document.getElementById("formulaInicio").textContent=formula;document.getElementById("formulaTotal").textContent=formula;document.getElementById("cierre").textContent="$"+cajaEf.toFixed(2)+" CIERRE EF";document.getElementById("estado").textContent="INV $"+invVenta.toFixed(2)+" | EF $"+cajaEf.toFixed(2)+" TR $"+cajaTr.toFixed(2);var cuad=document.getElementById("cuadrosTotal");var html='<div class="fact" style="text-align:center;background:#F0FDF4"><small>1. VENTA EF</small><br><b>$'+vEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#EFF6FF"><small>2. VENTA TR</small><br><b>$'+vTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>3. FIADO</small><br><b>$'+vFi.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>4. CONSUMO</small><br><b>$'+vCons.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#E8F5E9"><small>5. AB EF</small><br><b>$'+abEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#DBEAFE"><small>6. AB TR</small><br><b>$'+abTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white"><small>7. REAL DIA</small><br><b>$'+ventaReal.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>8. AB TOTAL</small><br><b>$'+(abEf+abTr).toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>9. GASTO EF</small><br><b>$'+gEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>10. GASTO TR</small><br><b>$'+gTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#DC2626;color:white"><small>11. GASTO TOT</small><br><b>$'+totalG.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>12. POR COBRAR</small><br><b>$'+fiadoTotal.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>13. COMPRA EF</small><br><b>$'+cEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>14. COMPRA TR</small><br><b>$'+cTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white"><small>15. COMPRA TOT</small><br><b>$'+totalC.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#10B981;color:white"><small>16. BALANCE</small><br><b>$'+balance.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#2563EB;color:white"><small>17. COSTO INV</small><br><b>$'+invCosto.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#3B82F6;color:white"><small>18. VENTA INV</small><br><b>$'+invVenta.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#10B981;color:white"><small>19. GAN INV</small><br><b>$'+(invVenta-invCosto).toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:white;border:2px solid #FF6B35"><small>20. PRODUCTOS</small><br><b>'+invProd+' / '+invUnid+' unid</b></div>';cuad.innerHTML=html;document.getElementById("totalInventarioBox").innerHTML='📦 '+(esTodo?"TODO":fechaFiltro)+' | COSTO $'+invCosto.toFixed(2)+' VENTA $'+invVenta.toFixed(2)+' GAN $'+(invVenta-invCosto).toFixed(2)+'<br><small>'+invProd+' prod | '+invUnid+' unid</small>';var lista="";for(var k in ventas){var v=ventas[k];var fg=(v.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;lista+='<div class="fact"><b>'+fg+' - '+v.cliente+' $'+parseFloat(v.total||0).toFixed(2)+' '+v.pago+'</b></div>';}document.getElementById("listaInicio").innerHTML=lista||'<div style="padding:20px;text-align:center">SIN MOVIMIENTOS<br><button onclick="verTodo()" style="background:#FF6B35;color:white;border:none;padding:10px 20px;border-radius:10px">VER TODO</button></div>';}
db.ref("inventario").on("value",s=>{inv=s.val()||{};buscarInvent();renderTodo();});
db.ref("ventas").on("value",s=>{ventas=s.val()||{};renderTodo();});
db.ref("gastos").on("value",s=>{gastos=s.val()||{};renderGastos();renderTodo();});
db.ref("abonos").on("value",s=>{abonos=s.val()||{};renderTodo();renderFiados();});
db.ref("compras").on("value",s=>{compras=s.val()||{};renderCompras();renderTodo();});
db.ref("prestamos").on("value",s=>{prestamos=s.val()||{};renderPrestamos();renderTodo();});
db.ref("abonosPrestamos").on("value",s=>{abonosPrestamos=s.val()||{};renderTodo();});
ver("inicio");setTimeout(()=>{renderTodo();buscarInvent();},1000);
</script></body></html>
