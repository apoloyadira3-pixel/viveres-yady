<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viveres Yady</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f7fb;padding:15px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{color:#1a5cff;font-size:22px;text-align:center;margin-bottom:10px}
h2{font-size:16px;margin-bottom:8px;color:#333}
input,select,button{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #ddd;font-size:15px}
button{background:#1a5cff;color:#fff;border:none;font-weight:600;cursor:pointer}
button.sec{background:#eee;color:#333}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.badge{padding:2px 6px;border-radius:99px;font-size:11px}
.ok{background:#d1fae5;color:#065f46}
.low{background:#fee2e2;color:#991b1b}
.total{font-size:20px;font-weight:800;color:#1a5cff;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>VIVERES YADY</h1>
<p style="text-align:center;font-size:13px;color:#666">Sistema permanente - Nunca se borra</p>
<div class="total" id="totalVal">$0.00</div>
<p style="text-align:center;font-size:12px" id="totalItems">0 productos</p>
</div>
<div class="card">
<h2>Agregar Producto</h2>
<input id="nombre" placeholder="Nombre: arroz, aceite, etc">
<div class="row">
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="precio" type="number" step="0.01" placeholder="Precio $">
</div>
<select id="categoria">
<option value="Viveres">Viveres</option>
<option value="Bebidas">Bebidas</option>
<option value="Limpieza">Limpieza</option>
<option value="Otros">Otros</option>
</select>
<button onclick="agregar()">Guardar Producto</button>
</div>
<div class="card">
<h2>Buscar</h2>
<input id="buscar" placeholder="Buscar producto..." oninput="render()">
<div style="margin-top:8px;overflow:auto;max-height:400px">
<table>
<thead><tr><th>Producto</th><th>Cant</th><th>Precio</th><th></th></tr></thead>
<tbody id="tabla"></tbody>
</table>
</div>
<div class="row" style="margin-top:10px">
<button class="sec" onclick="exportar()">Exportar Excel</button>
<button class="sec" onclick="if(confirm('Borrar todo?')){localStorage.clear();data=[];render()}">Borrar</button>
</div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('viveres-yady-v2')||'[]');
function save(){localStorage.setItem('viveres-yady-v2',JSON.stringify(data))}
function agregar(){
let n=nombre.value.trim(),c=parseFloat(cantidad.value),p=parseFloat(precio.value),cat=categoria.value;
if(!n||isNaN(c)||isNaN(p)) return alert('Llena nombre, cantidad y precio');
data.unshift({id:Date.now(),nombre:n,cantidad:c,precio:p,categoria:cat,fecha:new Date().toLocaleDateString()});
save();nombre.value='';cantidad.value='';precio.value='';render();
}
function eliminar(id){if(confirm('Eliminar?')){data=data.filter(x=>x.id!==id);save();render();}}
function render(){
let q=(buscar.value||'').toLowerCase();
let filtro=data.filter(x=>x.nombre.toLowerCase().includes(q));
let tot=0;filtro.forEach(x=>tot+=x.cantidad*x.precio);
totalVal.textContent='$'+tot.toFixed(2);
totalItems.textContent=filtro.length+' productos';
tabla.innerHTML=filtro.map(x=>`<tr>
<td><b>${x.nombre}</b><br><span style="font-size:10px;color:#888">${x.categoria} - ${x.fecha}</span></td>
<td><span class="badge ${x.cantidad<5?'low':'ok'}">${x.cantidad}</span></td>
<td>$${x.precio.toFixed(2)}</td>
<td><button class="sec" style="padding:4px 8px;width:auto" onclick="eliminar(${x.id})">X</button></td>
</tr>`).join('')||'<tr><td colspan=4 style="text-align:center;color:#888">Sin productos</td></tr>';
}
function exportar(){
let csv='Producto,Cantidad,Precio,Total,Categoria,Fecha\n'+data.map(x=>`${x.nombre},${x.cantidad},${x.precio},${(x.cantidad*x.precio).toFixed(2)},${x.categoria},${x.fecha}`).join('\n');
let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='viveres-yady.csv';a.click();
}
render();
</script>
</body>
</html>
