function renderGastosHistorial(){var h="",total=0;var ag=Object.keys(gastos).map(k=>({key:k,g:gastos[k]}));ag.sort((a,b)=>(b.g.fechaStr||"").localeCompare(a.g.fechaStr||""));ag.forEach(it=>{var g=it.g,k=it.key,mg=parseFloat(g.monto||0);total+=mg;h+='<div class="fact"><b>'+(g.fechaStr||"")+' '+(g.concepto||"")+' $'+mg.toFixed(2)+' '+(g.pago||"")+'</b> <button onclick="if(navigator.onLine)db.ref(\'gastos/'+k+'\').remove()" style="background:#DC2626;color:#fff;border:none;border-radius:5px;padding:3px 6px">X</button></div>'});document.getElementById("listaGastosHistorial").innerHTML=h||"SIN GASTOS";document.getElementById("totalGastosHeader").textContent="$"+total.toFixed(2)+" GASTOS"}
function renderFacturas(){var mf=document.getElementById("mesFacturas")?.value||"",tv=0,tc=0,hv="",hc="";Object.keys(ventas).forEach(k=>{var v=ventas[k];if(mf&&(v.fechaStr||"").substring(0,7)!==mf)return;tv+=parseFloat(v.total||0);hv+='<div class="fact"><b>VENTA '+(v.fechaStr||"")+' - '+v.cliente+' $'+parseFloat(v.total||0).toFixed(2)+' '+v.pago+'</b></div>'});Object.keys(compras).forEach(k=>{var c=compras[k];if(mf&&(c.fechaStr||"").substring(0,7)!==mf)return;tc+=parseFloat(c.total||0);hc+='<div class="fact"><b>COMPRA '+(c.fechaStr||"")+' $'+parseFloat(c.total||0).toFixed(2)+' '+c.proveedor+'</b></div>'});document.getElementById("listaFacturas").innerHTML=(hv+hc)||"SIN FACTURAS";document.getElementById("totalFacturasBox").innerHTML="VENTAS $"+tv.toFixed(2)+" - COMPRAS $"+tc.toFixed(2)}
function renderFiados(){var clientes={};for(var k in ventas){var v=ventas[k];var pg=(v.pago||"").toUpperCase();if(pg.indexOf("FIAD")<0&&pg.indexOf("CONTADO")<0)continue;clientes[(v.cliente||"CLIENTE").toUpperCase().trim()]=1}var h="",tg=0;for(var cli in clientes){var lista=ventasFiadoDe(cli).filter(it=>it.resto>0.009);var debe=0;lista.forEach(it=>debe+=it.resto);if(debe<=0.01)continue;tg+=debe;h+='<div class="fact"><b style="color:#DC2626">'+cli+' DEBE $'+debe.toFixed(2)+'</b><div>'+lista.map(it=>it.v.fechaStr+' $'+it.resto.toFixed(2)+' <button onclick="pagarVentaFiado(\''+it.key+'\',\''+cli+'\','+it.resto+',\'EFECTIVO\')" style="background:#10B981;color:#fff;border:none;border-radius:5px;padding:4px">PAGAR</button> <button onclick="abonarVentaFiado(\''+it.key+'\',\''+cli+'\','+it.resto+')" style="background:#F59E0B;color:#fff;border:none;border-radius:5px;padding:4px">ABONAR</button>').join("<br>")+'</div></div>'}document.getElementById("listaFiados").innerHTML=h||"SIN FIADOS";document.getElementById("totalFiado").innerHTML="$"+tg.toFixed(2)+" POR COBRAR"}
function guardarPrestamoFoto(){var cli=document.getElementById("clientePrestamo").value.trim().toUpperCase(),motivo=(document.getElementById("motivoPrestamo")?document.getElementById("motivoPrestamo").value.trim().toUpperCase():"")||"",monto=parseFloat(document.getElementById("montoPrestamo").value)||0,fecha=document.getElementById("fechaPrestamo").value||hoyStr,pago=document.getElementById("pagoPrestamo").value;if(!cli||monto<=0){toast("Falta");return}colaGuardar("prestamos",{persona:cli,cliente:cli,motivo:motivo,monto:monto,pago:pago,fecha:Date.now(),fechaStr:fecha+" "+new Date().toTimeString().substring(0,5)}).then(()=>{toast("PRESTAMO $"+monto.toFixed(2));document.getElementById("clientePrestamo").value="";document.getElementById("montoPrestamo").value="";document.getElementById("motivoPrestamo").value=""})}
function abonarPrestamo(kp){var p=prestamos[kp];if(!p)return;var debe=parseFloat(p.monto||0);var m=parseFloat(prompt((p.persona||"")+" DEBE $"+debe.toFixed(2),debe.toFixed(2))||0);if(!m||m<=0)return;colaGuardar("abonos",{cliente:p.persona,monto:m,pago:"EFECTIVO",tipo:"PRESTAMO",prestamoKey:kp,fecha:Date.now(),fechaStr:hoyStr+" "+new Date().toTimeString().substring(0,5)})}
function renderPrestamosFoto(){var h="",tot=0;for(var k in prestamos){var p=prestamos[k],debe=parseFloat(p.monto||0);tot+=debe;h+='<div class="fact"><b>'+(p.persona||"")+' $'+parseFloat(p.monto||0).toFixed(2)+' - PARA: '+(p.motivo||"")+'</b><br><button onclick="abonarPrestamo(\''+k+'\')" style="background:#10B981;color:#fff;border:none;border-radius:8px;padding:8px">ABONAR</button> <button onclick="if(navigator.onLine)db.ref(\'prestamos/'+k+'\').remove()" style="background:#DC2626;color:#fff;border:none;border-radius:8px;padding:8px">X</button></div>'}document.getElementById("listaPrestamos").innerHTML=h||"SIN PRESTAMOS";document.getElementById("totalPrestado").textContent="$"+tot.toFixed(2)+" PRESTADO POR COBRAR"}
function renderTodo(){var vEf2=0,vTr2=0,vMix2=0,vFi2=0,vContFi2=0,vCons2=0,abFiEf2=0,abFiTr2=0,abPre2=0,abGas2=0,cEf2=0,cTr2=0,cFi2=0,gEf2=0,gTr2=0,gFiPagar2=0,pTot2=0;for(var k in ventas){var v=ventas[k];if(!filtrarPorFechaResumen(v.fechaStr))continue;var pg=(v.pago||"").toUpperCase(),tot=parseFloat(v.total||0),ab=parseFloat(v.abonoInicial||0);if(pg.indexOf("MIXT")>=0&&pg.indexOf("FIAD")<0&&pg.indexOf("CONTADO")<0){vMix2+=tot;vEf2+=parseFloat(v.efec||0);vTr2+=parseFloat(v.trans||0)}else if(pg.indexOf("FIAD")>=0||pg.indexOf("CONTADO")>=0){vFi2+=tot-ab;vContFi2+=ab}else if(pg.indexOf("TRANS")>=0)vTr2+=tot;else if(pg.indexOf("CONSUMO")>=0)vCons2+=tot;else vEf2+=tot}for(var k in abonos){var a=abonos[k];if(!filtrarPorFechaResumen(a.fechaStr))continue;var ta=(a.tipo||"").toUpperCase(),ma=parseFloat(a.monto||0);if(ta.indexOf("PREST")>=0)abPre2+=ma;else if(ta==="GASTO_FIADO")abGas2+=ma;else if((a.pago||"").toUpperCase().indexOf("TRANS")>=0)abFiTr2+=ma;else abFiEf2+=ma}for(var k in compras){var c=compras[k];if(!filtrarPorFechaResumen(c.fechaStr))continue;var pc=(c.pago||"").toUpperCase(),tc=parseFloat(c.total||0);if(pc.indexOf("FIAD")>=0)cFi2+=tc;else if(pc.indexOf("TRANS")>=0)cTr2+=tc;else cEf2+=tc}for(var k in gastos){var g=gastos[k];if(!filtrarPorFechaResumen(g.fechaStr))continue;var esF=(g.pago||"").toUpperCase().indexOf("FIAD")>=0,mg=parseFloat(g.monto||0),abg=parseFloat(g.abonoInicial||0);if(esF){gEf2+=abg;var dg=mg-abg;for(var kk in abonos){var aa=abonos[kk];if(aa.tipo==="GASTO_FIADO"&&aa.gastoKey===k)dg-=parseFloat(aa.monto||0)}if(dg>0)gFiPagar2+=dg}else if((g.pago||"").toUpperCase().indexOf("TRANS")>=0)gTr2+=mg;else gEf2+=mg}for(var k in prestamos){var p=prestamos[k];if(!filtrarPorFechaResumen(p.fechaStr))continue;pTot2+=parseFloat(p.monto||0)}var totalVentas2=vEf2+vTr2+vMix2+vFi2+vCons2;var totalAbonos2=abFiEf2+abFiTr2+abPre2+abGas2;var totalCompras2=cEf2+cTr2+cFi2;var totalGastos2=gEf2+gTr2;var cajaFinal2=vEf2+vMix2+abFiEf2+abPre2+abGas2+vContFi2-cEf2-gEf2-pTot2;var iu=0,ic=0,iv=0;for(var k in inv){if(!inv[k]||!inv[k].nombre)continue;var s=parseFloat(inv[k].stock||0);if(s<=0)continue;iu+=s;ic+=s*parseFloat(inv[k].compra||0);iv+=s*parseFloat(inv[k].venta||0)}document.getElementById("totalInventarioBox").textContent="INVENTARIO: "+iu+" UNIDADES - COSTO $"+ic.toFixed(2)+" - VENTA $"+iv.toFixed(2);function cuadro(n,titulo,valor,color){return '<div style="background:'+color+';color:#fff;border-radius:10px;padding:12px"><div style="font-size:10px;font-weight:900">'+n+'. '+titulo+'</div><div style="font-size:18px;font-weight:900">$'+valor.toFixed(2)+'</div></div>'}document.getElementById("cuadrosTotal").innerHTML=cuadro(1,"VENTAS EFECTIVO",vEf2,"#16A34A")+cuadro(2,"VENTAS TRANSFERENCIA",vTr2,"#2563EB")+cuadro(3,"VENTAS MIXTO",vMix2,"#0F766E")+cuadro(4,"FIADOS NUEVOS",vFi2,"#DC2626")+cuadro(5,"CONTADO RECIBIDO FIADO",vContFi2,"#F59E0B")+cuadro(6,"CONSUMO PROPIO",vCons2,"#111")+cuadro(7,"TOTAL VENTAS",totalVentas2,"#FF6B35")+cuadro(8,"ABONOS FIADOS EFECTIVO",abFiEf2,"#16A34A")+cuadro(9,"ABONOS FIADOS TRANSFERENCIA",abFiTr2,"#2563EB")+cuadro(10,"ABONOS PRESTAMOS",abPre2,"#7C3AED")+cuadro(11,"ABONOS GASTOS FIADOS",abGas2,"#EC4899")+cuadro(12,"TOTAL ABONOS",totalAbonos2,"#F59E0B")+cuadro(13,"COMPRAS EFECTIVO",cEf2,"#16A34A")+cuadro(14,"COMPRAS TRANSFERENCIA",cTr2,"#2563EB")+cuadro(15,"COMPRAS FIADO",cFi2,"#DC2626")+cuadro(16,"TOTAL COMPRAS",totalCompras2,"#FF6B35")+cuadro(17,"GASTOS EFECTIVO",gEf2,"#DC2626")+cuadro(18,"GASTOS TRANSFERENCIA",gTr2,"#2563EB")+cuadro(19,"GASTOS FIADOS POR PAGAR",gFiPagar2,"#7C3AED")+cuadro(20,"TOTAL GASTOS PAGADOS",totalGastos2,"#DC2626")+cuadro(21,"PRESTAMOS TOTAL",pTot2,"#0F766E")+'<div style="background:#10B981;color:#fff;border-radius:10px;padding:14px;text-align:center;font-weight:900;grid-column:1/3">DEBE TENER EN CAJA: $'+cajaFinal2.toFixed(2)+'</div>';var mov="";for(var k in ventas){var v=ventas[k];if(!filtrarPorFechaResumen(v.fechaStr))continue;mov+='<div class="fact">VENTA '+(v.fechaStr||"")+' '+v.cliente+' $'+parseFloat(v.total||0).toFixed(2)+' '+v.pago+'</div>'}for(var k in compras){var c=compras[k];if(!filtrarPorFechaResumen(c.fechaStr))continue;mov+='<div class="fact">COMPRA '+(c.fechaStr||"")+' '+c.proveedor+' $'+parseFloat(c.total||0).toFixed(2)+'</div>'}document.getElementById("listaTotalMovimientos").innerHTML=mov||"SIN MOVIMIENTOS";}
