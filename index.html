<div style="background:#FFF7ED;border:3px solid #FF6B35;border-radius:12px;padding:10px;margin:8px 0">
<div style="display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start">
<div style="text-align:center"><div id="previewCompraFoto" style="width:80px;height:80px;background:#FFE4CC;border-radius:12px;display:flex;align-items:center;justify-content:center;border:3px dashed #FF6B35;font-size:30px">📦</div><button onclick="tomarFotoCompra()" class="btn" style="margin-top:6px;background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;height:28px;font-size:9px;width:80px;border:none">📸 CAMARA</button><button onclick="subirFotoCompraGaleria()" class="btn" style="margin-top:4px;background:#2563EB;color:white;height:28px;font-size:9px;width:80px;border:none">🖼️ GALERIA</button><button onclick="quitarFotoCompra()" class="btn" style="margin-top:4px;background:#DC2626;color:white;height:22px;font-size:8px;width:80px;border:none">❌ QUITAR</button></div>
<div><div class="row" style="margin:0"><input id="nombreProd" class="input" placeholder="PRODUCTO" style="height:40px" oninput="buscarEnCompras()"><input id="cantProd" type="number" value="1" class="input" style="height:40px;text-align:center"><input id="compraProd" type="number" step="0.01" class="input" placeholder="COMPRA $ 0.056" style="height:40px"><input id="ventaProd" type="number" step="0.01" class="input" placeholder="VENTA $ 0.10" style="height:40px"></div><div class="row" style="margin:6px 0 0 0"><input id="codigoProd" class="input" placeholder="CODIGO 7868000" style="height:36px"><input id="prov" class="input" placeholder="PROVEEDOR Merkato" style="height:36px"><select id="pagoCompra" class="input" style="height:36px"><option>EFECTIVO</option><option>TRANSFERENCIA</option></select><button onclick="scanCompras()" class="btn" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;height:36px">📷 SCAN</button></div></div>
</div>

<div id="sec-resumen" class="card hidden"><div style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:10px;border-radius:8px;text-align:center;font-weight:900">TOTAL - COBRAR </div><div id="formulaTotal" style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:8px;border-radius:8px;text-align:center;font-weight:900;margin:6px 0;font-size:10px"></div><div id="cuadrosTotal" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:6px 0"></div></div>
<div id="msg" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FF6B35;color:white;padding:12px 20px;border-radius:99px;display:none;z-index:999;font-weight:900"></div>
<div id="scannerOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;flex-direction:column;align-items:center;justify-content:center"><video id="video" style="width:90%;max-width:400px;border:4px solid #FF6B35;border-radius:12px"></video><div style="color:white;font-weight:900;margin:12px">ESCANEANDO...</div><button onclick="cerrarScanner()" style="background:#DC2626;color:white;border:none;padding:12px 24px;border-radius:8px;font-weight:900">CERRAR SCAN</button><canvas id="canvas" style="display:none"></canvas></div>
<script>
var hoyStr='2026-10-23';
firebase.initializeApp({databaseURL:"https://inventario-19b33-default-rtdb.europe-west1.firebasedatabase.app"});
var db=firebase.database();
var inv={},car=[],compraTemp=[],ventas={},gastos={},abonos={},compras={},filtroFecha='TODO',filtroGastos='TODO';
var compraFotoTemp=null;
var scannerActivo=false,scannerTarget='ventas',streamActual=null;
function toast(m){var e=document.getElementById('msg');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},3000);}
function ver(t){document.querySelectorAll('[id^="sec-"]').forEach(function(s){s.classList.add('hidden');});var sec=document.getElementById('sec-'+t);if(sec) sec.classList.remove('hidden');document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});var tab=document.getElementById('tab-'+t);if(tab) tab.classList.add('active');if(t=='inicio'||t=='resumen') renderTodo();if(t=='compras') renderCompras();if(t=='gastos') renderGastos();if(t=='ventas') renderVentas();if(t=='invent') buscarInvent();if(t=='fiados') renderFiados();if(t=='facturas') renderFacturas();}
function ponerHoy(){document.getElementById('fechaInicio').value=hoyStr;filtroFecha=hoyStr;renderTodo();}
function ponerAyer(){var d=new Date();d.setDate(d.getDate()-1);filtroFecha=d.toISOString().slice(0,10);document.getElementById('fechaInicio').value=filtroFecha;renderTodo();}
function verTodo(){filtroFecha='TODO';document.getElementById('fechaInicio').value='';renderTodo();}
function ponerHoyGastos(){var el=document.getElementById('fechaGasto');if(el) el.value=hoyStr;filtroGastos=hoyStr;renderGastos();}
function verTodosGastos(){filtroGastos='TODO';var el=document.getElementById('fechaGasto');if(el) el.value='';renderGastos();}
function ponerHoyFacturas(){var el=document.getElementById('fechaFacturas');if(el) el.value=hoyStr;renderFacturas();}
function guardarApertura(){var v=document.getElementById('apertura')?document.getElementById('apertura').value:'0';try{localStorage.setItem('apertura_'+hoyStr,v);}catch(e){}renderTodo();}
function scanInvent(){abrirScanner('invent');}
function scanVentas(){abrirScanner('ventas');}
function scanCompras(){abrirScanner('compras');}
function abrirScanner(target){scannerTarget=target;var overlay=document.getElementById('scannerOverlay');overlay.style.display='flex';var video=document.getElementById('video');if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){streamActual=stream;video.srcObject=stream;video.play();scannerActivo=true;escanearLoop();}).catch(function(err){toast('No camara');cerrarScanner();});}}
function cerrarScanner(){scannerActivo=false;document.getElementById('scannerOverlay').style.display='none';if(streamActual){streamActual.getTracks().forEach(function(t){t.stop();});streamActual=null;}}
function escanearLoop(){if(!scannerActivo) return;var video=document.getElementById('video');var canvas=document.getElementById('canvas');if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;var ctx=canvas.getContext('2d');ctx.drawImage(video,0,0,canvas.width,canvas.height);if('BarcodeDetector' in window){var detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a']});detector.detect(canvas).then(function(barcodes){if(barcodes.length>0){var code=barcodes[0].rawValue;toast('CODIGO '+code);cerrarScanner();if(scannerTarget=='compras') document.getElementById('codigoProd').value=code;else if(scannerTarget=='invent'){document.getElementById('buscarInvent').value=code;buscarInvent();}else{document.getElementById('buscar').value=code;buscar();}return;}requestAnimationFrame(escanearLoop);}).catch(function(){requestAnimationFrame(escanearLoop);});}else{requestAnimationFrame(escanearLoop);}}else{requestAnimationFrame(escanearLoop);}}
function buscar(){var q=document.getElementById('buscar').value.toLowerCase().trim();var d=document.getElementById('dropdown');if(!q){d.style.display='none';return;}var h='';var count=0;for(var k in inv){var p=inv[k];if(!p||!p.nombre) continue;if(p.nombre.toLowerCase().indexOf(q)>=0 || (p.codigo||'').toString().toLowerCase().indexOf(q)>=0){var foto=p.imagen||p.foto||'';var fotoHtml=foto?'<img src="'+foto+'" style="width:45px;height:45px;border-radius:8px;object-fit:cover">':'📦';h+='<div onclick="addCart(\''+k+'\')" style="padding:10px;border-bottom:2px solid #FFE4CC;cursor:pointer;display:flex;gap:8px;align-items:center;background:white">'+fotoHtml+'<div style="flex:1"><b>'+p.nombre.toUpperCase()+'</b> - $'+parseFloat(p.venta||0).toFixed(2)+' - STOCK '+(p.stock||0)+'</div><div style="background:#16A34A;color:white;padding:6px 10px;border-radius:6px">+ AGREGAR</div></div>';count++;if(count>25) break;}}if(h=='') h='<div style="padding:12px;text-align:center">NO ENCONTRADO</div>';d.innerHTML=h;d.style.display='block';}
function addCart(k){if(!inv[k]) return;var cant=parseInt(document.getElementById('cant').value||1);if(cant<=0) cant=1;var p=inv[k];var found=-1;for(var i=0;i<car.length;i++) if(car[i].key==k) found=i;if(found>=0){car[found].cant+=cant;}else{car.push({key:k,nombre:p.nombre,venta:parseFloat(p.venta||0),cant:cant});}renderCar();toast(p.nombre.toUpperCase()+' x'+cant+' - TOCA PARA COBRAR ARRIBA');}// COBRAR 
function cobrarDirecto(){
  if(car.length==0){toast('VACIO - Agrega ');return;}
  vender('EFECTIVO');
}
function vender(pago){
  if(car.length==0){toast('VACIO - Agrega ');return;}
  var tot=0;for(var i=0;i<car.length;i++) tot+=car[i].venta*car[i].cant;
  var cli=document.getElementById('cliente').value.trim()||'CLIENTE';
  var fecha=document.getElementById('fechaVentaInput').value||hoyStr;
  // DIRECTO SIN CONFIRMAR - SIN VENTANITA
  for(var i=0;i<car.length;i++){
    if(inv[car[i].key]){
      var nuevoStock=Math.max(0,parseInt(inv[car[i].key].stock||0)-car[i].cant);
      db.ref('inventario/'+car[i].key+'/stock').set(nuevoStock);
    }
  }
  db.ref('ventas').push({prods:car,total:tot,cliente:cli,clienteKey:cli.toLowerCase(),fecha:Date.now(),fechaStr:fecha,pago:pago,cantTotal:car.length}).then(function(){
    toast('✅ COBRADO $'+tot.toFixed(2)+' '+pago+' - TOCA PARA COBRAR ');
    car=[];renderCar();renderVentas();renderTodo();
    document.getElementById('buscar').value='';
    var dd=document.getElementById('dropdown'); if(dd) dd.style.display='none';
    document.getElementById('cliente').value='';
  });
}
function renderCar(){
  var h='';var subtotal=0;
  for(var i=0;i<car.length;i++){subtotal+=car[i].venta*car[i].cant;}
  for(var i=0;i<car.length;i++){
    var p=car[i];
    var foto=inv[p.key]&&(inv[p.key].imagen||inv[p.key].foto)?'<img src="'+(inv[p.key].imagen||inv[p.key].foto)+'" style="width:30px;height:30px;border-radius:6px;object-fit:cover">':'📦';
    h+='<div class="fact" style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:6px;align-items:center">'+foto+'<div><b>'+p.nombre.toUpperCase()+'</b><br>$'+parseFloat(p.venta||0).toFixed(2)+' x '+p.cant+' = $'+(p.venta*p.cant).toFixed(2)+'</div></div><div style="display:flex;gap:4px"><button onclick="cambiarCant('+i+',-1)" style="width:30px;height:30px">-</button><span style="width:30px;text-align:center;font-weight:900">'+p.cant+'</span><button onclick="cambiarCant('+i+',1)" style="width:30px;height:30px">+</button><button onclick="car.splice('+i+',1);renderCar()" style="background:#DC2626;color:white;border:none;border-radius:6px;padding:6px 10px">X</button></div></div>';
  }
  document.getElementById('carrito').innerHTML=h||'<div style="text-align:center;padding:10px;background:#FEF3C7;border-radius:8px">VACIO </div>';
  document.getElementById('totalCobrar').innerHTML='$'+subtotal.toFixed(2)+' COBRAR<br><small style="font-size:15px">'+car.length+' tipos - VENTA </small>';
}
function cambiarCant(idx,delta){if(idx<0||idx>=car.length) return;car[idx].cant+=delta;if(car[idx].cant<=0) car.splice(idx,1);renderCar();}
function cambiarFoto(key){
  var input=document.createElement('input');input.type='file';input.accept='image/*';
  input.onchange=function(){
    var file=input.files[0];if(!file) return;
    if(file.size>4*1024*1024){toast('Foto muy grande max 4MB');return;}

function renderFacturas(){var f=document.getElementById('fechaFacturas').value||hoyStr;var h='',vt=0,gt=0,ct=0;for(var k in ventas){if((ventas[k].fechaStr||'')!=f) continue;vt+=parseFloat(ventas[k].total||0);h+='<div class="fact"><b>VENTA '+ventas[k].cliente.toUpperCase()+' $'+parseFloat(ventas[k].total||0).toFixed(2)+'</b></div>';}for(var k in gastos){if((gastos[k].fechaStr||'').substring(0,10)!=f) continue;gt+=parseFloat(gastos[k].monto||0);h+='<div class="fact"><b>GASTO '+gastos[k].concepto+' $'+parseFloat(gastos[k].monto||0).toFixed(2)+'</b></div>';}for(var k in compras){var cc=compras[k];var fg=(cc.fechaStr||cc.fecha||'').substring(0,10);if(fg!=f) continue;var tot=parseFloat(cc.total||0);if(!tot&&cc.productos){tot=0;for(var i=0;i<cc.productos.length;i++)tot+=parseFloat(cc.productos[i].total||0);}ct+=tot;h+='<div class="fact"><b>COMPRA '+(cc.proveedor||'PROV')+' $'+tot.toFixed(2)+'</b></div>';}var bal=vt-gt-ct;document.getElementById('listaFacturas').innerHTML='<div style="background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white;padding:8px;border-radius:8px;text-align:center;font-weight:900;margin-bottom:6px">VENTAS $'+vt.toFixed(2)+' - GASTOS $'+gt.toFixed(2)+' - COMPRAS $'+ct.toFixed(2)+' = BALANCE $'+bal.toFixed(2)+'</div>'+(h||'<div style="text-align:center;padding:12px">SIN MOVIMIENTOS</div>');}
function renderTodo(){var fechaFiltro=document.getElementById('fechaInicio').value||'';if(filtroFecha=='TODO') fechaFiltro=''; else if(filtroFecha!='TODO'&&!fechaFiltro) fechaFiltro=filtroFecha;var apertura=0;try{apertura=parseFloat(localStorage.getItem('apertura_'+hoyStr)||'0')||0;}catch(e){}var vEf=0,vTr=0,vFi=0,vCons=0,abEf=0,abTr=0,gEf=0,gTr=0,cEf=0,cTr=0,fiadoPorCobrarTotal=0;for(var k in ventas){var v=ventas[k];var fg=(v.fechaStr||'').substring(0,10);var tot=parseFloat(v.total||0);if(v.pago=='FIADO'){var ab=abonos[k]||{};var abonado=0;for(var ak in ab) abonado+=parseFloat(ab[ak].monto||0);var saldo=tot-abonado;if(saldo>0.01) fiadoPorCobrarTotal+=saldo;}if(fechaFiltro&&fg!=fechaFiltro) continue;if(v.pago=='FIADO'){vFi+=tot;}else{var p=(v.pago||'').toUpperCase();if(p=='EFECTIVO')vEf+=tot;else if(p=='TRANSFERENCIA')vTr+=tot;else vCons+=tot;}}for(var vid in abonos){for(var aid in abonos[vid]){var ab=abonos[vid][aid];var fg=(ab.fechaStr||'').substring(0,10);if(fechaFiltro&&fg!=fechaFiltro) continue;var m=parseFloat(ab.monto||0);if((ab.pago||'').toUpperCase()=='TRANSFERENCIA')abTr+=m;else abEf+=m;}}for(var k in gastos){var gg=gastos[k];var fg=(gg.fechaStr||'').substring(0,10);if(fechaFiltro&&fg!=fechaFiltro) continue;var m=parseFloat(gg.monto||0);if((gg.pago||'').toUpperCase()=='TRANSFERENCIA')gTr+=m;else gEf+=m;}for(var k in compras){var cc=compras[k];var fg=(cc.fechaStr||cc.fecha||'').substring(0,10);if(fechaFiltro&&fg!=fechaFiltro) continue;var tot=parseFloat(cc.total||0);if(!tot&&cc.productos){tot=0;for(var i=0;i<cc.productos.length;i++)tot+=parseFloat(cc.productos[i].total||0);}if((cc.pago||'').toUpperCase()=='TRANSFERENCIA')cTr+=tot;else cEf+=tot;}var totalVentasSinFiado=vEf+vTr+vCons;var totalAbonos=abEf+abTr;var ventaRealDelDia=totalVentasSinFiado+totalAbonos;var totalGastos=gEf+gTr;var totalCompras=cEf+cTr;var balance=ventaRealDelDia-totalGastos-totalCompras;var cierre=apertura+vEf+abEf-cEf-gEf;var html16='<div class="fact" style="text-align:center"><small> oyStr)+': Apertura $'+apertura.toFixed(2)+' + EF $'+vEf.toFixed(2)+' + AB EF $'+abEf.toFixed(2)+' - C EF $'+cEf.toFixed(2)+' - G EF $'+gEf.toFixed(2)+' = $'+cierre.toFixed(2)+' | REAL $'+ventaRealDelDia.toFixed(2)+' BAL $'+balance.toFixed(2);var f1=document.getElementById('formulaInicio');if(f1) f1.textContent=formulaText;var f2=document.getElementById('formulaTotal');if(f2) f2.textContent=formulaText;var cier=document.getElementById('cierre');if(cier) cier.textContent='$'+cierre.toFixed(2)+' CIERRE';var est=document.getElementById('estado');if(est) est.textContent='✅ COBRAR DIRECTO $'+ventaRealDelDia.toFixed(2)+' | '+Object.keys(inv).length+' PROD | ';var arr=[];for(var k in ventas){var v=ventas[k];var fg=(v.fechaStr||'').substring(0,10);if(fechaFiltro&&fg!=fechaFiltro) continue;arr.push({fecha:fg,tipo:'VENTA '+v.pago,c:v.cliente,tot:v.total,detalle:(v.prods||[]).map(function(p){return p.nombre.toUpperCase()+' x'+p.cant;}).join(', ')});}arr.sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});var h='';for(var i=0;i<Math.min(arr.length,60);i++){var r=arr[i];h+='<div class="fact" style="font-size:10px"><b>'+r.fecha+' - '+r.tipo+' '+(r.c||'').toUpperCase()+' - $'+parseFloat(r.tot||0).toFixed(2)+'</b><br><small>'+(r.detalle||'').substring(0,100)+'</small></div>';}var li=document.getElementById('listaInicio');if(li) li.innerHTML=h||'<div style="padding:20px;text-align:center;background:#FEF3C7;border-radius:8px">SIN MOVIMIENTOS</div>';}
