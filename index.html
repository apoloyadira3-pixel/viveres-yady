<script>

firebase.initializeApp({databaseURL:"https://inventario-19b33-default-rtdb.europe-west1.firebasedatabase.app"});var db=firebase.database();var inv={},car=[],compraTemp=[],ventas={},gastos={},abonos={},compras={},prestamos={},filtroFecha="TODO";var compraFotoTemp=null,scannerActivo=false,scannerTarget="ventas",streamActual=null;var searchResults=[],searchResultsCompras=[];var editandoFiadoId=null;var editandoProductos=[];var editandoOriginal=[];var searchAgregar=[];

function abrirScanner(target){scannerTarget=target;document.getElementById("scannerOverlay").style.display="flex";var video=document.getElementById("video");navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(stream=>{streamActual=stream;video.srcObject=stream;video.play();scannerActivo=true;escanearLoop();});}
function cerrarScanner(){scannerActivo=false;document.getElementById("scannerOverlay").style.display="none";if(streamActual){streamActual.getTracks().forEach(t=>t.stop());streamActual=null;}}
function escanearLoop(){if(!scannerActivo)return;var video=document.getElementById("video");var canvas=document.getElementById("canvas");if(video.readyState===video.HAVE_ENOUGH_DATA){canvas.width=video.videoWidth;canvas.height=video.videoHeight;var ctx=canvas.getContext("2d");ctx.drawImage(video,0,0,canvas.width,canvas.height);if("BarcodeDetector" in window){var detector=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","qr_code"]});detector.detect(canvas).then(barcodes=>{if(barcodes.length>0){var code=barcodes[0].rawValue;toast("CODIGO "+code);cerrarScanner();if(scannerTarget=="compras")document.getElementById("codigoProd").value=code;else if(scannerTarget=="invent"){document.getElementById("buscarInvent").value=code;buscarInvent();}else{document.getElementById("buscar").value=code;buscar();}return;}requestAnimationFrame(escanearLoop);});}else requestAnimationFrame(escanearLoop);}else requestAnimationFrame(escanearLoop);}
function encontrarPorCodigo(codigo){if(!codigo)return null;var c=codigo.toString().trim().toUpperCase();if(!c)return null;for(var k in inv){var p=inv[k];if(!p)continue;var pc=(p.codigo||"").toString().trim().toUpperCase();if(pc&&pc===c)return k;}return null;}
function fusionarDuplicados(){if(!confirm("Fusionar duplicados por mismo CODIGO? BIRI BIRI 10+2=12"))return;var porCodigo={},borrar=[];for(var k in inv){var p=inv[k];var cod=(p.codigo||"").toString().trim().toUpperCase();if(!cod)continue;if(!porCodigo[cod])porCodigo[cod]=k;else{var kOrig=porCodigo[cod];var pOrig=inv[kOrig];var nuevoStock=parseInt(pOrig.stock||0)+parseInt(p.stock||0);db.ref("inventario/"+kOrig).update({stock:nuevoStock});borrar.push(k);}}borrar.forEach(function(kDup){db.ref("inventario/"+kDup).remove();});toast("✅ "+borrar.length+" FUSIONADOS");}
function buscar(){var q=document.getElementById("buscar").value.toLowerCase().trim();var d=document.getElementById("dropdown");if(!q){d.style.display="none";return;}var h="";searchResults=[];var count=0;for(var k in inv){var p=inv[k];if(!p||!p.nombre)continue;if(p.nombre.toLowerCase().indexOf(q)>=0||(p.codigo||"").toLowerCase().indexOf(q)>=0){searchResults.push(k);var img=p.imagen||p.foto;var imgMini=img?'<img src="'+img+'" style="width:32px;height:32px;border-radius:6px;object-fit:cover">':'📦';h+='<div class="fact" onclick="addCartIdx('+(searchResults.length-1)+')" style="cursor:pointer;display:flex;gap:10px;align-items:center"><div>'+imgMini+'</div><div><b>'+p.nombre.toUpperCase()+'</b><br>$'+parseFloat(p.venta||0).toFixed(2)+' STOCK '+(p.stock||0)+'</div></div>';count++;if(count>20)break;}}d.innerHTML=h||"NO ENCONTRADO";d.style.display="block";}

function editarFiado(id){if(!ventas[id])return;editandoFiadoId=id;var v=ventas[id];editandoOriginal=JSON.parse(JSON.stringify(v.prods||[]));editandoProductos=JSON.parse(JSON.stringify(v.prods||[]));document.getElementById("tituloEditarFiado").textContent="EDITAR FIADO - "+v.cliente.toUpperCase();document.getElementById("infoFiadoEditar").innerHTML="Cliente: <b>"+v.cliente.toUpperCase()+"</b> | Fecha: "+(v.fechaStr||"")+"<br>Original: $"+parseFloat(v.total||0).toFixed(2)+" | Productos: "+(v.prods||[]).length;document.getElementById("overlayEditarFiado").style.display="flex";renderProductosEditar();}
function cerrarEditarFiado(){document.getElementById("overlayEditarFiado").style.display="none";editandoFiadoId=null;editandoProductos=[];document.getElementById("dropdownAgregarFiado").style.display="none";}
function renderProductosEditar(){var h="";var tot=0;for(var i=0;i<editandoProductos.length;i++){var p=editandoProductos[i];tot+=p.venta*p.cant;h+='<div class="fact" style="display:flex;gap:10px;align-items:center;background:white;border:2px solid #FF6B35"><div style="flex:1"><b>'+p.nombre.toUpperCase()+'</b><br><small>$'+parseFloat(p.venta).toFixed(2)+' x '+p.cant+' = $'+(p.venta*p.cant).toFixed(2)+'</small></div><div style="display:flex;gap:4px"><button onclick="cambiarCantEditar('+i+',-1)" style="background:#6B7280;color:white;border:none;border-radius:8px;padding:8px 12px;font-weight:900">-</button><div style="background:#FFF7ED;border:2px solid #FFE4CC;border-radius:8px;padding:8px 14px;font-weight:900;min-width:36px;text-align:center">'+p.cant+'</div><button onclick="cambiarCantEditar('+i+',1)" style="background:#16A34A;color:white;border:none;border-radius:8px;padding:8px 12px;font-weight:900">+</button><button onclick="quitarProductoEditar('+i+')" style="background:#DC2626;color:white;border:none;border-radius:8px;padding:8px 12px;font-weight:900">X</button></div></div>';}if(editandoProductos.length==0)h="<div style='padding:20px;text-align:center;color:#DC2626;font-weight:900'>SIN PRODUCTOS - AGREGA ABAJO O ELIMINA FIADO</div>";document.getElementById("listaProductosEditar").innerHTML=h;document.getElementById("totalEditarFiado").textContent="$"+tot.toFixed(2)+" NUEVO TOTAL";}
function cambiarCantEditar(idx,delta){if(!editandoProductos[idx])return;var nueva=editandoProductos[idx].cant+delta;if(nueva<=0){if(confirm("¿Quitar "+editandoProductos[idx].nombre+"?")){editandoProductos.splice(idx,1);} } else {editandoProductos[idx].cant=nueva;}renderProductosEditar();}
function quitarProductoEditar(idx){if(confirm("¿Quitar "+editandoProductos[idx].nombre+"?")){editandoProductos.splice(idx,1);renderProductosEditar();}}
function buscarAgregarFiado(){var q=document.getElementById("buscarAgregarFiado").value.toLowerCase().trim();var drop=document.getElementById("dropdownAgregarFiado");if(!q){drop.style.display="none";return;}var h="";searchAgregar=[];for(var k in inv){var p=inv[k];if(!p||!p.nombre)continue;if(p.nombre.toLowerCase().indexOf(q)>=0||(p.codigo||"").toLowerCase().indexOf(q)>=0){searchAgregar.push(k);h+='<div onclick="agregarProductoAFiadoIdx('+(searchAgregar.length-1)+')" style="padding:12px;border-bottom:1px solid #FFE4CC;cursor:pointer;display:flex;justify-content:space-between"><div><b>'+p.nombre.toUpperCase()+'</b><br><small>$'+parseFloat(p.venta||0).toFixed(2)+' STOCK '+ (p.stock||0)+'</small></div><div style="background:#16A34A;color:white;padding:6px 12px;border-radius:8px;font-weight:900">+ AGREGAR</div></div>';if(searchAgregar.length>15)break;}}drop.innerHTML=h||"NO ENCONTRADO";drop.style.display="block";}
function agregarProductoAFiadoIdx(i){agregarProductoAFiado(searchAgregar[i]);}
function agregarProductoAFiado(k){if(!inv[k])return;var cant=parseInt(document.getElementById("cantAgregarFiado").value||1);if(cant<=0)cant=1;var p=inv[k];if((p.stock||0)<cant){if(!confirm(p.nombre.toUpperCase()+" solo tiene STOCK "+p.stock+" y quieres agregar "+cant+" ¿Continuar?"))return;}var existente=-1;for(var j=0;j<editandoProductos.length;j++)if(editandoProductos[j].key==k)existente=j;if(existente>=0){editandoProductos[existente].cant+=cant;}else{editandoProductos.push({key:k,nombre:p.nombre,venta:parseFloat(p.venta||0),compra:parseFloat(p.compra||0),cant:cant,imagen:p.imagen||p.foto||""});}document.getElementById("buscarAgregarFiado").value="";document.getElementById("dropdownAgregarFiado").style.display="none";renderProductosEditar();toast("✅ "+p.nombre.toUpperCase()+" x"+cant);}
function guardarEdicionFiado(){if(!editandoFiadoId)return;if(editandoProductos.length==0){if(!confirm("Fiado sin productos ¿Eliminar fiado?"))return;eliminarFiadoCompleto();return;}var tot=0,gan=0;for(var i=0;i<editandoProductos.length;i++){tot+=editandoProductos[i].venta*editandoProductos[i].cant;gan+=(editandoProductos[i].venta-editandoProductos[i].compra)*editandoProductos[i].cant;}var originalMap={};for(var i=0;i<editandoOriginal.length;i++){var po=editandoOriginal[i];originalMap[po.key]=(originalMap[po.key]||0)+po.cant;}var nuevoMap={};for(var i=0;i<editandoProductos.length;i++){var pn=editandoProductos[i];nuevoMap[pn.key]=(nuevoMap[pn.key]||0)+pn.cant;}var todasKeys={};for(var k in originalMap)todasKeys[k]=true;for(var k in nuevoMap)todasKeys[k]=true;for(var k in todasKeys){var orig=originalMap[k]||0;var nuevo=nuevoMap[k]||0;var diff=nuevo-orig;if(diff!=0 && inv[k]){var stockActual=parseInt(inv[k].stock||0);var nuevoStock=stockActual-diff;if(nuevoStock<0)nuevoStock=0;db.ref("inventario/"+k+"/stock").set(nuevoStock);}}db.ref("ventas/"+editandoFiadoId).update({prods:editandoProductos,total:tot,ganancia:gan,editado:true,fechaEdicion:Date.now()}).then(()=>{toast("✅ FIADO EDITADO $"+tot.toFixed(2));cerrarEditarFiado();});}
function eliminarFiadoCompleto(){if(!editandoFiadoId){toast("No hay fiado");return;}if(!confirm("¿ELIMINAR FIADO COMPLETO? Se devolverá el stock"))return;var v=ventas[editandoFiadoId];if(v&&v.prods){for(var i=0;i<v.prods.length;i++){var p=v.prods[i];if(inv[p.key]){var ns=parseInt(inv[p.key].stock||0)+parseInt(p.cant||0);db.ref("inventario/"+p.key+"/stock").set(ns);}}}db.ref("ventas/"+editandoFiadoId).remove().then(()=>{toast("🗑️ FIADO ELIMINADO");cerrarEditarFiado();});}
function abonarFiado(id){var monto=parseFloat(prompt("Monto a abonar para "+ventas[id].cliente.toUpperCase(),"")||0);if(!monto||monto<=0)return;var pago=prompt("EFECTIVO o TRANSFERENCIA?","EFECTIVO")||"EFECTIVO";db.ref("abonos/"+id).push({monto:monto,pago:pago.toUpperCase(),fechaStr:hoyStr+" "+new Date().toTimeString().substring(0,5)}).then(()=>{toast("✅ ABONO $"+monto.toFixed(2));});}
function verDetalleFiado(id){var v=ventas[id];var txt="FIADO: "+v.cliente+"\nTotal: $"+v.total+"\n\n";for(var i=0;i<(v.prods||[]).length;i++)txt+=v.prods[i].nombre+" x"+v.prods[i].cant+" $"+(v.prods[i].venta*v.prods[i].cant).toFixed(2)+"\n";alert(txt);}
function renderTodo(){var inputFecha=document.getElementById("fechaResumen")||document.getElementById("fechaInicio");var fechaFiltro=(inputFecha&&inputFecha.value)?inputFecha.value:"TODO";var esTodo=fechaFiltro==="TODO"||fechaFiltro===""||!fechaFiltro;var apertura=parseFloat(localStorage.getItem("apertura_"+hoyStr)||0);var vEf=0,vTr=0,vFi=0,vCons=0,abEf=0,abTr=0,gEf=0,gTr=0,cEf=0,cTr=0,fiadoTotal=0;var invCosto=0,invVenta=0,invUnid=0,invProd=0;for(var k in inv){var p=inv[k];invCosto+=(p.stock||0)*(p.compra||0);invVenta+=(p.stock||0)*(p.venta||0);invUnid+=(p.stock||0);invProd++;}for(var k in compras){var c=compras[k];var fg=(c.fechaStr||c.fecha||"").substring(0,10);var coincide=esTodo||fg===fechaFiltro;if(coincide){if((c.pago||"").toUpperCase().indexOf("TRANS")>=0)cTr+=parseFloat(c.total||0);else cEf+=parseFloat(c.total||0);}}for(var k in gastos){var g=gastos[k];var fg=(g.fechaStr||g.fecha||"").substring(0,10);var coincide=esTodo||fg===fechaFiltro;if(coincide){if((g.pago||"").toUpperCase().indexOf("TRANS")>=0)gTr+=parseFloat(g.monto||0);else gEf+=parseFloat(g.monto||0);}}for(var k in ventas){var v=ventas[k];var fg=(v.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;var tot=parseFloat(v.total||0);if(v.pago=="FIADO"){vFi+=tot;var ab=abonos[k]||{};var abon=0;for(var a in ab)abon+=parseFloat(ab[a].monto||0);fiadoTotal+=(tot-abon);}else if(v.pago=="EFECTIVO")vEf+=tot;else if((v.pago||"").toUpperCase().indexOf("TRANS")>=0)vTr+=tot;else vCons+=tot;}for(var k in abonos){for(var a in abonos[k]){var ab=abonos[k][a];var fg=(ab.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;if((ab.pago||"").toUpperCase().indexOf("TRANS")>=0)abTr+=parseFloat(ab.monto||0);else abEf+=parseFloat(ab.monto||0);}}for(var k in prestamos){var pr=prestamos[k];var abon=0;for(var a in (pr.abonos||{}))abon+=parseFloat(pr.abonos[a].monto||0);fiadoTotal+=(parseFloat(pr.monto||0)-abon);}var ventaReal=vEf+vTr+vCons+abEf+abTr;var totalG=gEf+gTr;var totalC=cEf+cTr;var balance=ventaReal-totalG-totalC;var cajaEf=apertura+vEf+abEf-cEf-gEf;var cajaTr=vTr+abTr-gTr-cTr;var formula="FILTRO: "+fechaFiltro+" | HOY "+hoyStr+" | CIERRE EF Ap $"+apertura.toFixed(2)+" + EF $"+vEf.toFixed(2)+" + AB EF $"+abEf.toFixed(2)+" - C EF $"+cEf.toFixed(2)+" - G EF $"+gEf.toFixed(2)+" = $"+cajaEf.toFixed(2)+" | TR $"+cajaTr.toFixed(2)+" | BAL $"+balance.toFixed(2);var ft=document.getElementById("formulaTotal");if(ft)ft.textContent=formula;var fi=document.getElementById("formulaInicio");if(fi)fi.textContent=formula;var ce=document.getElementById("cierre");if(ce)ce.textContent="$"+cajaEf.toFixed(2)+" CIERRE EF";var est=document.getElementById("estado");if(est)est.textContent="INV $"+invVenta.toFixed(2)+" | EF $"+cajaEf.toFixed(2)+" TR $"+cajaTr.toFixed(2);var cuad=document.getElementById("cuadrosTotal");if(cuad){var h2='<div class="fact" style="text-align:center;background:#F0FDF4"><small>1. VENTA EF</small><br><b>$'+vEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#EFF6FF"><small>2. VENTA TR</small><br><b>$'+vTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>3. FIADO</small><br><b>$'+vFi.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>4. CONSUMO</small><br><b>$'+vCons.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#E8F5E9"><small>5. AB EF</small><br><b>$'+abEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#DBEAFE"><small>6. AB TR</small><br><b>$'+abTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white"><small>7. REAL DIA</small><br><b>$'+ventaReal.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>8. AB TOTAL</small><br><b>$'+(abEf+abTr).toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>9. GASTO EF</small><br><b>$'+gEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>10. GASTO TR</small><br><b>$'+gTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#DC2626;color:white"><small>11. GASTO TOT</small><br><b>$'+totalG.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>12. POR COBRAR</small><br><b>$'+fiadoTotal.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>13. COMPRA EF</small><br><b>$'+cEf.toFixed(2)+'</b></div><div class="fact" style="text-align:center"><small>14. COMPRA TR</small><br><b>$'+cTr.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:linear-gradient(90deg,#FF6B35,#F59E0B);color:white"><small>15. COMPRA TOT</small><br><b>$'+totalC.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#10B981;color:white"><small>16. BALANCE</small><br><b>$'+balance.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#2563EB;color:white"><small>17. COSTO INV</small><br><b>$'+invCosto.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#3B82F6;color:white"><small>18. VENTA INV</small><br><b>$'+invVenta.toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:#10B981;color:white"><small>19. GAN INV</small><br><b>$'+(invVenta-invCosto).toFixed(2)+'</b></div><div class="fact" style="text-align:center;background:white;border:2px solid #FF6B35"><small>20. PRODUCTOS</small><br><b>'+invProd+' / '+invUnid+' unid</b></div>';cuad.innerHTML=h2;}var tib=document.getElementById("totalInventarioBox");if(tib)tib.innerHTML='FILTRO: '+(esTodo?"TODO":fechaFiltro)+' | COSTO $'+invCosto.toFixed(2)+' VENTA $'+invVenta.toFixed(2)+' GAN $'+(invVenta-invCosto).toFixed(2)+'<br><small>'+invProd+' prod | '+invUnid+' unid</small>';var lista="";for(var k in ventas){var v=ventas[k];var fg=(v.fechaStr||"").substring(0,10);if(!esTodo&&fg!=fechaFiltro)continue;lista+='<div class="fact"><b>'+fg+' - '+v.cliente+' $'+parseFloat(v.total||0).toFixed(2)+' '+v.pago+'</b></div>';}var li=document.getElementById("listaInicio");if(li)li.innerHTML=lista||"SIN MOVIMIENTOS";var tdb=document.getElementById("totalDiaBox");if(tdb)tdb.innerHTML='VENTA REAL HOY: <b>$'+ventaReal.toFixed(2)+'</b> | BALANCE: <b>$'+balance.toFixed(2)+'</b>';}
db.ref("inventario").on("value",s=>{inv=s.val()||{};buscarInvent();renderTodo();});
db.ref("ventas").on("value",s=>{ventas=s.val()||{};renderFiados();renderTodo();renderFacturas();});
db.ref("gastos").on("value",s=>{gastos=s.val()||{};renderGastos();renderTodo();renderFacturas();});
db.ref("abonos").on("value",s=>{abonos=s.val()||{};renderFiados();renderTodo();});
db.ref("compras").on("value",s=>{compras=s.val()||{};renderCompras();renderTodo();renderFacturas();});
db.ref("prestamos").on("value",s=>{prestamos=s.val()||{};renderPrestamos();renderTodo();});
ver("invent");setTimeout(()=>{renderTodo();buscarInvent();},800);
</script></body></html>
